name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Sanitize All Android Images and Splash
        run: |
          echo "=== Fixing corrupted splash and duplicate icons ==="
          sudo apt-get update && sudo apt-get install -y imagemagick

          # 1. Remove duplicate png inside mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*.png

          # 2. Fix valid launcher icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" "$dir/ic_launcher.png"
            convert -size 192x192 xc:"#3880ff" -fill white -draw "circle 96,96 96,20" "$dir/ic_launcher_round.png"
            convert -size 192x192 xc:transparent -fill white -draw "circle 96,96 96,20" "$dir/ic_launcher_foreground.png"
          done

          # 3. Fix corrupted splash images across all drawable folders
          find android/app/src/main/res -type d -name "drawable*" | while read -r d; do
            if [ -f "$d/splash.png" ]; then
              echo "Fixing corrupt splash in $d"
              convert -size 480x800 xc:"#1a1b1f" PNG32:"$d/splash.png"
            fi
          done

          # Ensure default drawable/splash.png exists and is valid
          mkdir -p android/app/src/main/res/drawable
          convert -size 480x800 xc:"#1a1b1f" PNG32:"android/app/src/main/res/drawable/splash.png"
          echo "All images sanitized successfully!"

      - name: Inject Official Play Store Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== Injecting Official Play Store Keystore ==="
          mkdir -p android/app
          node -e "
          const fs = require('fs');
          let b64 = process.env.RELEASE_KEYSTORE_BASE64;
          if (!b64 && fs.existsSync('public/keystore_b64.txt')) {
            b64 = fs.readFileSync('public/keystore_b64.txt', 'utf8').trim();
          }
          if (!b64) {
            console.error('Error: Keystore base64 not found in secrets or file!');
            process.exit(1);
          }
          const buf = Buffer.from(b64, 'base64');
          fs.writeFileSync('android/app/release.keystore', buf);
          fs.writeFileSync('release.keystore', buf);
          console.log('Keystore written successfully! Size:', buf.length, 'bytes');
          "
          ls -la android/app/release.keystore

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          cd android
          mkdir -p gradle/wrapper
          echo "Restoring official executable gradle-wrapper.jar..."
          curl -f -sLo gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/free122055-png/sorry/main/android/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB) and APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Sign APK with Official Play Store Key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE="android/app/release.keystore"
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          KEYPASS="${RELEASE_KEY_PASSWORD:-almayadin123}"

          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Signing APK: $APK_FILE"
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$KEYSTORE" \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              "$APK_FILE" "$ALIAS" || true
          fi

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          
