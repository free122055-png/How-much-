name: Build Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab-apk:
    name: Build & Sign AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inject Official Play Store Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== Injecting Official Play Store Keystore ==="
          mkdir -p android/app
          node -e "
          const fs = require('fs');
          let b64 = process.env.RELEASE_KEYSTORE_BASE64;
          if (!b64 && fs.existsSync('public/keystore_b64.txt')) {
            b64 = fs.readFileSync('public/keystore_b64.txt', 'utf8').trim();
          }
          if (!b64) {
            console.error('Error: Keystore base64 not found in secrets or file!');
            process.exit(1);
          }
          const buf = Buffer.from(b64, 'base64');
          fs.writeFileSync('android/app/release.keystore', buf);
          fs.writeFileSync('release.keystore', buf);
          console.log('Keystore written successfully! Size:', buf.length, 'bytes');
          "
          ls -la android/app/release.keystore

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          cd android
          mkdir -p gradle/wrapper
          echo "Restoring official executable gradle-wrapper.jar..."
          curl -f -sLo gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/free122055-png/sorry/main/android/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Patch Android Build Configs for AGP 8+ Compatibility
        run: |
          cd android
          if ! grep -q "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi
          if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties
          fi
          python3 -c "
          path = 'build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          target = '''        if (project.hasProperty(\"android\")) {
            project.android {'''
          replacement = '''        if (project.hasProperty(\"android\")) {
            project.android {
                if (namespace == null) {
                    namespace = project.group != '' ? project.group : \"com.capacitor.plugin.\" + project.name.replaceAll('-', '_')
                }'''
          if 'if (namespace == null)' not in content and target in content:
              content = content.replace(target, replacement, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print('Successfully patched build.gradle namespace injection!')
          "

      - name: Build Android App Bundle (AAB) and APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Sign AAB and APK with Official Play Store Key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE="android/app/release.keystore"
          STOREPASS="${RELEASE_KEYSTORE_PASSWORD:-almayadin123}"
          ALIAS="${RELEASE_KEY_ALIAS:-almayadin}"
          KEYPASS="${RELEASE_KEY_PASSWORD:-almayadin123}"

          # 1. Sign AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB file not found!"
            exit 1
          fi
          echo "Found generated AAB: $AAB_FILE"
          echo "Signing AAB with official Google Play Keystore..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$AAB_FILE" "$ALIAS"

          echo "=== Verifying AAB Signature ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified" || true
          echo "=== AAB Signature Verified successfully! ==="

          # 2. Sign APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Release APK file not found!"
            exit 1
          fi
          echo "Found generated APK: $APK_FILE"
          echo "Signing APK with official Google Play Keystore..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            "$APK_FILE" "$ALIAS"

          echo "=== Verifying APK Signature ==="
          jarsigner -verify -verbose -certs "$APK_FILE" | grep -i "jar verified" || true
          echo "=== APK Signature Verified successfully! ==="

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
